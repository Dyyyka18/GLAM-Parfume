<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" href="assets/logo.png">

<title>GLAM Parfume — Sistem Pengelolaan Stok</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap">

<link rel="stylesheet" href="style.css">
</head>

<body>
<div class="app" id="app">

<aside class="sidebar" id="sidebar">
<div class="brand">
<img src="assets/logo.png" class="brandmark logoimg" alt="GLAM Parfume">
<div>
<strong>GLAM</strong>
<small>PARFUME · INVENTORY</small>
</div>
</div>

<div class="navlabel">MENU UTAMA</div>
<nav class="nav">
<button class="active" data-page="dashboard"><span class="ico">⌂</span>Dashboard</button>
<button data-page="barang"><span class="ico">▤</span>Master Barang</button>
<button data-page="masuk"><span class="ico">↙️</span>Stok Masuk</button>
<button data-page="keluar"><span class="ico">↗️</span>Stok Keluar</button>
<button data-page="rekap"><span class="ico">▦</span>Rekap Stok</button>
<button data-page="laporan"><span class="ico">▧</span>Laporan</button>
</nav>

<div class="sidebottom">
<div class="userline">
<div class="avatar">A</div>
<div>
<b>Pemilik Toko</b><br>
<span style="font-size:10px;color:#c8bbc3">Administrator</span>
</div>
</div>
<a href="#" id="logout" style="color:#d9b7c9;text-decoration:none">Keluar dari akun ↗️</a>
</div>
</aside>

<div class="scrim" id="scrim"></div>

<main class="main">
<header class="topbar">
<div style="display:flex;align-items:center;gap:12px">
<button class="notif mobilemenu" id="mobilemenu">☰</button>
<div class="crumb">
GLAM Parfume
<span style="padding:0 7px;color:#c7beb8">/</span>
<b id="crumb">Dashboard</b>
</div>
</div>

<div class="topright">
<span class="today" id="dateText"></span>
<button class="notif" id="bell" title="Notifikasi stok menipis" onclick="goLow()">♧<span class="badge" id="badge"></span></button>
<div class="avatar">A</div>
</div>
</header>

<div class="content" id="content"></div>
</main>
</div>

<div class="modalback" id="modalback">
<div class="modal">
<div class="modalhead">
<h2 id="modalTitle">Tambah Barang</h2>
<button class="close" id="closeModal">✕</button>
</div>
<div id="modalBody"></div>
</div>
</div>

<div class="toast" id="toast"></div>

<div class="notifcard" id="notifcard">
<div style="font-size:20px">⚠️</div>
<div style="flex:1">
<b id="notifTitle"></b>
<p id="notifText"></p>
<button class="btn primary" onclick="goLow()">Lihat Stok Menipis →</button>
</div>
<button class="notifx" onclick="closeNotif()" title="Tutup">✕</button>
</div>

<div class="login" id="login">
<div class="loginbox">
<div class="loginlogo">
<img src="assets/logo.png" class="brandmark logoimg" alt="GLAM Parfume">
<h2>GLAM PARFUME</h2>
<p>INVENTORY MANAGEMENT SYSTEM</p>
</div>

<div class="field">
<label>Username</label>
<input id="username" value="admin" placeholder="Masukkan username">
</div>

<div class="field">
<label>Password</label>
<input id="password" type="password" value="glam123" placeholder="Masukkan password">
</div>

<button class="btn primary" id="loginBtn">Masuk ke Dashboard →</button>
</div>
</div>

<script src="app.js"></script>
</body>
</html>
